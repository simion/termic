name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual, for hunting flakes: the only honest way to tell a flaky case from
  # a broken one is to run the same commit several times, and without this the
  # alternative is empty commits. windows.yml already carries it.
  workflow_dispatch:

# A newer push supersedes the run still going for the same branch or PR:
# its results would be stale on arrival, and the three e2e jobs hold a
# macOS, a Linux and (in windows.yml) a Windows runner for ~20 minutes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The specs and the perf suite live outside the app's `tsc -b` project, so
      # nothing was checking them: 71 errors had accumulated, including two unit
      # strings in the perf report that were simply wrong. Cheap, so it rides
      # with the unit tests rather than earning its own job.
      - run: npm run typecheck:e2e

  rust:
    name: Rust (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Run unit tests
        working-directory: src-tauri
        # --workspace so the CLI crates (termic-proto wire round-trips,
        # termic-cli exit-code + output goldens) run alongside the app's
        # lib tests. The behavioral sandbox tests self-skip off macOS.
        run: cargo test --workspace --lib

  e2e-linux:
    # The same WebdriverIO suite on Linux (WebKitGTK under Xvfb), so a change
    # is checked on all three platforms: this, the macOS job below, and the
    # Windows job in windows.yml. Reporting, not gating, like the other two.
    name: E2E (WebdriverIO, Linux)
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            xvfb dbus-x11 at-spi2-core xclip xdotool
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Specs commit in the fixture repo; a fresh runner has no identity.
      - run: |
          git config --global user.name "termic e2e"
          git config --global user.email "e2e@termic.dev"
      - name: Seed e2e fixture profile
        run: node scripts/e2e-seed.mjs
      - name: Build e2e binary
        run: npm run e2e:build
      - name: Run e2e suite
        timeout-minutes: 75
        env:
          TERMIC_E2E_FAIL_CAPTURE: "1"
          TERMIC_E2E_TIMING: "1"
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1440x900x24" npm run test:e2e
      # Reported, never gated: wall-clock on a shared runner flakes, and a
      # flaky gate gets muted (docs/perf-ci.md). The gate on fixed waits is
      # e2e/fixedWaits.test.ts, which counts instead of timing.
      - name: Slowest e2e cases
        if: always()
        run: node scripts/e2e-slowest.mjs
      - name: Collect the debug log
        if: always()
        run: |
          mkdir -p .e2e/artifacts
          cp /tmp/termic-debug.log .e2e/artifacts/ 2>/dev/null || true
          cp .e2e/profile/e2e-*.log .e2e/artifacts/ 2>/dev/null || true
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-linux
          path: .e2e/artifacts
          if-no-files-found: ignore
          include-hidden-files: true

  e2e:
    # Written WebdriverIO suite driving the real macOS WKWebView window
    # (docs/e2e-tests.md + the `e2e` skill). macOS-only (WKWebView). NOT a
    # required check yet — it's here to surface flakiness so we can harden it
    # before gating merges on it. Screenshots are skipped in CI (CI=true).
    name: E2E (WebdriverIO, macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Seed e2e fixture profile
        run: node scripts/e2e-seed.mjs
      - name: Build e2e binary
        run: npm run e2e:build
      - name: Run e2e suite
        env:
          TERMIC_E2E_TIMING: "1"
        run: npm run test:e2e
      - name: Slowest e2e cases
        if: always()
        run: node scripts/e2e-slowest.mjs
      # The debug log lives in the per-user temp dir (`std::env::temp_dir()`),
      # i.e. somewhere under /var/folders on macOS. Copying it here rather
      # than globbing it in upload-artifact: `/var/folders/**` made the
      # uploader walk the whole tree, where it hit an unreadable
      # LaunchServices store and failed the step with EACCES, so a failing
      # run uploaded NOTHING (not the log, not the screenshots).
      - name: Collect the debug log
        if: failure()
        run: |
          mkdir -p .e2e/artifacts
          cp "${TMPDIR%/}/termic-debug.log" .e2e/artifacts/ 2>/dev/null || true
          # The app may run under a different TMPDIR than this shell. Bounded
          # depth so this stays a lookup, not a filesystem walk, and errors
          # are swallowed so an unreadable sibling cannot fail the job.
          find /var/folders -maxdepth 4 -name termic-debug.log 2>/dev/null \
            | head -5 | while read -r f; do cp "$f" ".e2e/artifacts/$(basename "$(dirname "$f")")-termic-debug.log" 2>/dev/null || true; done
          ls -la .e2e/artifacts || true

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            .e2e/artifacts
          if-no-files-found: ignore
          # Same trap as perf.yml: `.e2e/` is hidden, so every screenshot and
          # debug log from a failing run was silently dropped. With
          # `if-no-files-found: ignore` there was not even a warning.
          include-hidden-files: true
