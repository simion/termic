name: Release

# Push a tag like `v0.3.1` (driven by `make release BUMP=patch|minor|major`).
# Parallel platform builds (Mac universal on macos-26, Linux AppImage on
# ubuntu-latest), both ed25519-signed for the in-app updater. The release
# job stitches everything into one GitHub Release; downstream jobs bump:
#   * simion/homebrew-tap        (Casks/termic.rb gets version + mac sha)
#   * simion/homebrew-termic     (same cask, legacy tap kept for old installs)
#   * simion/termic.dev          (public/updates/{latest,changelog}.json)
#
# Brew + AppImage users see the new version automatically; running
# Termic instances on either platform see the in-app updater pill
# within ~5 min (CF Pages cache TTL on the manifest).
#
# Windows (experimental): NSIS installer on windows-latest, signed for the
# updater with the same key. It is deliberately NOT in the release job's
# `needs`: a Windows failure must never hold back the Mac and Linux release.
# `release-windows` attaches its assets to the release afterwards, and the
# manifest carries a `windows-x86_64` entry only when that upload happened.
# No Authenticode signing yet, so SmartScreen warns on the first install.
#
# Linux scope: AppImage only. `.deb` / `.rpm` are skipped intentionally
# because the Tauri updater can't replace package-manager-owned files,
# so shipping them would split users into "self-update works" vs
# "doesn't" buckets with no in-app signal.
#
# Apple signing + notarization (macOS) is OFF until six repo secrets exist:
# APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
# APPLE_API_KEY, APPLE_API_ISSUER, APPLE_API_KEY_CONTENT. Until then the mac
# build is ad-hoc signed and the release notes tell users how to clear the
# quarantine bit. Once all six are set, the build is Developer ID signed,
# notarized, stapled, and VERIFIED (spctl + stapler) before it can publish.
#
# After enrolling, also set the repo VARIABLE `REQUIRE_NOTARIZATION=true`.
# That makes a missing certificate a hard failure instead of a silent fall
# back to ad-hoc, which matters because the Homebrew cask drops its `xattr`
# postflight at the same time: an ad-hoc build published after that point is
# one nobody can open, and nothing else would tell us.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write           # needed to create the GitHub Release

env:
  # Hard-coded so PRs from forks can't override.
  WEBSITE_REPO: simion/termic.dev
  WEBSITE_MANIFEST_PATH: public/updates/latest.json
  WEBSITE_CHANGELOG_PATH: public/updates/changelog.json
  WEBSITE_CHANGELOG_MD_PATH: public/updates/changelog.md

jobs:
  # Cheap fast-fail: type-check the frontend on Ubuntu (~1 min) before
  # spinning up the ~5-min Mac runners on both arches. Catches the
  # broken-import / bad-prop class of errors that bit v0.1.1, without
  # paying for either Mac runner. Cargo errors get caught later by
  # `tauri build` in build-* since cross-compiling the Rust side from
  # Linux needs the macOS SDK; not worth the setup.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc -b

  # ─── Apple Silicon (arm64) ─────────────────────────────────────────
  # ─── Universal macOS build (arm64 + x86_64 fused) ─────────────────
  # Single job on macos-26 (arm runner): installs both rust targets,
  # passes --target universal-apple-darwin to tauri, which builds
  # both arches in-house and lipo's them into one fat Mach-O. Output
  # is a single Termic_<v>_universal.dmg + Termic.app.tar.gz that
  # runs natively on both arch families. macOS auto-selects the
  # right slice at exec time.
  #
  # MUST be macos-26 (Tahoe), not macos-14: the window-control (traffic
  # light) layout follows the SDK the binary was LINKED against. An older
  # runner links a pre-Tahoe SDK, so macOS renders the release in
  # compatibility mode (smaller, pre-Tahoe-positioned traffic lights) on a
  # Tahoe machine, misaligned vs. a locally-built dev binary linked against
  # the Tahoe SDK. Building on macos-26 links the Tahoe SDK → native chrome
  # that matches local. minimumSystemVersion (tauri.conf.json) stays 12.0,
  # so backward compat is unaffected. See tauri-apps/tauri#14477.
  #
  # Why universal-in-one-job instead of two:
  #   - No dependency on macos-13 (Intel) runners which were queue-
  #     stuck routinely on the free tier.
  #   - One artifact to publish + one sha in the cask + one updater
  #     URL (the tauri-plugin-updater dispatches on the running
  #     arch's platform key, but both keys point at the same .tar.gz
  #     since macOS unpacks the slice it needs).
  #   - ~2x build time on a single runner vs. parallel, but much less
  #     than waiting for an Intel runner to come available.
  # termic-server, the small daemon Settings > Remote > Add a server
  # installs on a Linux box (docs/remote.md). Built once here, static musl
  # for x86_64 and aarch64, and bundled by every build-* job: the app ships
  # the builds it installs, and a server needs no internet to get one.
  server-bins:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - run: cargo install cargo-zigbuild --locked
      - run: node scripts/build-termic-server.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: termic-server
          path: src-tauri/resources/termic-server/termic-server-*
          if-no-files-found: error

  # The same daemon for a Mac as a server (a headless Mac mini): aarch64
  # and x86_64, plain cargo on a Mac runner (Apple's SDK). The linker signs
  # them ad hoc, which is what a binary installed over ssh needs (a file
  # copied by ssh carries no quarantine); build-mac re-signs its own copy
  # with the Developer ID, because notarization refuses an unsigned or
  # ad-hoc Mach-O inside the app bundle.
  server-bins-mac:
    needs: validate
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: node scripts/build-termic-server.mjs darwin
      - uses: actions/upload-artifact@v4
        with:
          name: termic-server-mac
          path: src-tauri/resources/termic-server/termic-server-*
          if-no-files-found: error

  build-mac:
    needs: [validate, server-bins, server-bins-mac]
    runs-on: macos-26
    outputs:
      version:   ${{ steps.meta.outputs.version }}
      dmg_name:  ${{ steps.meta.outputs.dmg_name }}
      dmg_sha:   ${{ steps.hashes.outputs.dmg_sha }}
      sig:       ${{ steps.hashes.outputs.sig }}
      # "true" only after the artifact PASSED the spctl/stapler check below.
      # The release job keys its install footer off this, so the download
      # instructions can never claim more than the build actually delivered.
      notarized: ${{ steps.signing.outputs.notarize }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: termic-server*
          merge-multiple: true
          path: src-tauri/resources/termic-server
      - name: Resolve version + filenames
        id: meta
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Tauri's universal target produces `<productName>_<v>_universal.dmg`
          # in src-tauri/target/universal-apple-darwin/release/bundle/dmg/
          # APFS hides case mismatches locally; GitHub Releases URLs are
          # case-SENSITIVE so the cask MUST reference exactly this casing.
          echo "dmg_name=Termic_${VERSION}_universal.dmg" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          # BOTH targets needed for the universal build - tauri-cli
          # invokes cargo twice (once per arch) then lipo's the output.
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Cache Rust target dir
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-universal-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: npm ci
      - name: Configure Apple signing & notarization
        id: signing
        # Three constraints shape this step:
        #   1. `secrets` is not allowed in step `if:` expressions - the
        #      whole workflow fails to parse (killed v0.10.10's first run
        #      at 0s). Gate in the shell instead.
        #   2. tauri treats SET-BUT-EMPTY APPLE_* env vars as "sign with
        #      this", so the build step must not see them at all until the
        #      secrets exist. Forward each var via GITHUB_ENV only when
        #      configured; fall back to ad-hoc signing ('-') meanwhile.
        #   3. `env.HOME` does not exist in workflow expressions - export
        #      the API-key PATH from the shell, where $HOME is real.
        #
        # ALL-OR-NOTHING. A half-configured signing setup is the dangerous
        # state, not the unconfigured one: tauri SOFT-SKIPS notarization when
        # the auth triple is incomplete (a log line, not an error), so a
        # missing APPLE_API_ISSUER would otherwise publish a signed-but-
        # UNnotarized dmg through a green pipeline. Gatekeeper rejects that
        # exactly as hard as it rejects an unsigned one. So: either all six
        # secrets are present, or none are. Anything between is a hard fail.
        #
        # REQUIRE_NOTARIZATION (a repo *variable*, not a secret, so it can't
        # be silently dropped along with them) is the latch. Set it to "true"
        # once enrolled in the Apple Developer Program. From then on, a
        # missing certificate secret fails the release instead of quietly
        # falling back to ad-hoc, which after the Homebrew cask drops its
        # `xattr` postflight would ship a DMG that no new user can open.
        env:
          REQUIRE_NOTARIZATION:       ${{ vars.REQUIRE_NOTARIZATION }}
          APPLE_CERTIFICATE:          ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY:     ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY:              ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER:           ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT:      ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          addenv() { printf '%s<<__TERMIC_EOF__\n%s\n__TERMIC_EOF__\n' "$1" "$2" >> "$GITHUB_ENV"; }

          # Which of the six are present? (Names only - never the values.)
          present=0
          missing=""
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_CONTENT; do
            eval "val=\${$v:-}"
            if [ -n "$val" ]; then present=$((present + 1)); else missing="$missing $v"; fi
          done

          if [ "$present" -eq 6 ]; then
            echo "All six Apple secrets present: Developer ID signing + notarization."
            addenv APPLE_CERTIFICATE          "$APPLE_CERTIFICATE"
            addenv APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
            addenv APPLE_SIGNING_IDENTITY     "$APPLE_SIGNING_IDENTITY"
            mkdir -p ~/.appstoreconnect/private_keys
            printf '%s' "$APPLE_API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_"$APPLE_API_KEY".p8
            addenv APPLE_API_KEY      "$APPLE_API_KEY"
            addenv APPLE_API_ISSUER   "$APPLE_API_ISSUER"
            addenv APPLE_API_KEY_PATH "$HOME/.appstoreconnect/private_keys/AuthKey_$APPLE_API_KEY.p8"
            echo "notarize=true" >> "$GITHUB_OUTPUT"

            # Best-effort expiry warning. A Developer ID cert is valid ~5
            # years and dies silently: the first you'd hear of it is a failed
            # release. Non-fatal by design - openssl 3 needs -legacy for p12s
            # written by older tooling, and a parse failure here must never
            # break a release that would otherwise sign fine.
            if enddate=$(printf '%s' "$APPLE_CERTIFICATE" | base64 --decode 2>/dev/null \
                  | openssl pkcs12 -nokeys -clcerts -passin env:APPLE_CERTIFICATE_PASSWORD 2>/dev/null \
                  | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2); then
              if [ -n "$enddate" ]; then
                exp=$(date -j -f "%b %e %T %Y %Z" "$enddate" +%s 2>/dev/null || echo "")
                if [ -n "$exp" ]; then
                  days=$(( (exp - $(date +%s)) / 86400 ))
                  echo "Signing certificate expires in $days day(s) ($enddate)."
                  if [ "$days" -lt 30 ]; then
                    echo "::warning::Developer ID certificate expires in $days days ($enddate). Renew it before it takes a release down."
                  fi
                fi
              fi
            fi
          elif [ "$present" -eq 0 ] && [ -z "${REQUIRE_NOTARIZATION:-}" ]; then
            echo "::warning::No Apple secrets configured; ad-hoc signing ('-'). This DMG is NOT notarized and macOS will refuse to open it without a Gatekeeper bypass."
            addenv APPLE_SIGNING_IDENTITY "-"
            echo "notarize=false" >> "$GITHUB_OUTPUT"
          elif [ "$present" -eq 0 ]; then
            echo "::error::REQUIRE_NOTARIZATION is set, but no Apple secrets are configured. Refusing to publish an ad-hoc-signed build: the Homebrew cask no longer strips the quarantine bit, so nobody could open it."
            exit 1
          else
            echo "::error::Apple signing is partially configured. Missing:$missing"
            echo "::error::Set all six secrets, or none. A partial setup soft-skips notarization and publishes an unopenable build through a green pipeline."
            exit 1
          fi
      - name: Sign the bundled macOS termic-server builds
        # Notarization checks every Mach-O in the bundle, resources included,
        # and tauri signs only the app's own binary. Developer ID, hardened
        # runtime and a timestamp when notarizing; otherwise the linker's ad
        # hoc signature stays, as on the rest of an unnotarized build.
        if: steps.signing.outputs.notarize == 'true'
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/termic-server-sign.keychain-db"
          pw="$(openssl rand -hex 16)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 900 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          # codesign finds an identity only in a keychain on the search list,
          # `--keychain` or not ("no identity found" in v1.25.0's run), so the
          # temporary one joins the list, as Tauri's own signing step does,
          # and the list is put back after, for that later step.
          orig=$(security list-keychains -d user | xargs)
          security list-keychains -d user -s "$kc" $orig
          for f in src-tauri/resources/termic-server/termic-server-*-apple-darwin; do
            codesign --force --options runtime --timestamp --keychain "$kc" --sign "$APPLE_SIGNING_IDENTITY" "$f"
            codesign --verify --strict --verbose=2 "$f"
          done
          security list-keychains -d user -s $orig
          security delete-keychain "$kc"
      - name: Build, sign & notarize (universal)
        # Retried up to 3 times, but ONLY when the failure looks like Apple's
        # notary service (upload stall, 5xx, timeout). Notarization is a
        # network round-trip to a third party, so it is the one step here that
        # fails for reasons that have nothing to do with this repo, and a
        # transient one would otherwise strand an already-pushed tag.
        #
        # A compile error must NOT be retried: it would burn three builds to
        # reach the same failure. So the retry is gated on grepping the build
        # log, and any other failure exits on the first attempt exactly as
        # before. Retries are cheap - cargo's output is already in the target
        # dir, so attempt 2 re-bundles and re-notarizes without recompiling.
        env:
          TAURI_SIGNING_PRIVATE_KEY:          ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          attempts=3
          for i in $(seq 1 $attempts); do
            echo "→ tauri build, attempt $i/$attempts"
            set +e
            npm run tauri build -- --target universal-apple-darwin 2>&1 | tee "build-$i.log"
            status=${PIPESTATUS[0]}
            set -e
            [ "$status" -eq 0 ] && exit 0

            if [ "$i" -eq "$attempts" ]; then
              echo "::error::Build failed after $attempts attempts."
              exit "$status"
            fi
            if grep -qiE 'notariz|notarytool|altool|Unable to (upload|process)|could not (upload|be uploaded)|502 Bad Gateway|503 Service|timed? ?out|connection reset|network' "build-$i.log"; then
              backoff=$((i * 30))
              echo "::warning::Attempt $i failed and looks like an Apple notary / network problem. Retrying in ${backoff}s."
              sleep "$backoff"
              continue
            fi
            echo "::error::Build failed for a reason unrelated to notarization; not retrying."
            exit "$status"
          done
      - name: Notarize & staple the DMG
        # tauri notarizes and staples the .app, NOT the .dmg that wraps it.
        # Verified against a real build: the resulting DMG is Developer ID
        # signed but spctl reports `rejected / source=Unnotarized Developer
        # ID`, so double-clicking the download still raises "can't be opened
        # because Apple cannot check it for malicious software" - the exact
        # wall notarization is supposed to remove. The .app inside is fine;
        # the disk image people actually download is not. Apple's guidance is
        # to notarize the artifact you distribute, so we submit the DMG too.
        #
        # ORDER IS LOAD-BEARING: stapling REWRITES the dmg, changing its
        # sha256. This must run BEFORE "Compute SHA256", or the Homebrew cask
        # would carry the hash of the pre-staple file and every `brew install`
        # would fail checksum verification.
        if: steps.signing.outputs.notarize == 'true'
        run: |
          DMG="src-tauri/target/universal-apple-darwin/release/bundle/dmg/${{ steps.meta.outputs.dmg_name }}"
          for i in 1 2 3; do
            echo "→ notarytool submit, attempt $i/3"
            set +e
            xcrun notarytool submit "$DMG" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" \
              --wait 2>&1 | tee "notary-$i.log"
            status=${PIPESTATUS[0]}
            set -e
            [ "$status" -eq 0 ] && break

            # "Invalid" is Apple's verdict on the artifact itself, not a
            # transient. Retrying it just buys the same answer three times, so
            # fail now and print the log URL that says what Apple objected to.
            if grep -q 'status: Invalid' "notary-$i.log"; then
              echo "::error::Apple rejected the DMG (status: Invalid). Not a transient; fetch the log with 'xcrun notarytool log <id>' using the submission id above."
              exit 1
            fi
            if [ "$i" -eq 3 ]; then
              echo "::error::notarytool failed to accept the DMG after 3 attempts."
              exit 1
            fi
            echo "::warning::notarytool attempt $i failed (Apple's service or the network). Retrying in $((i * 30))s."
            sleep $((i * 30))
          done
          xcrun stapler staple "$DMG"
      - name: Verify signature & notarization
        # The assertion the pipeline was missing. Everything above can succeed
        # and still hand us an artifact macOS refuses to open, because tauri
        # reports a soft-skipped notarization as a log line, not an error.
        # Publishing is downstream of this step, so a build that is not
        # genuinely notarized + stapled never reaches a user.
        #
        # Stapling is what makes first launch work OFFLINE (and on a machine
        # that can't reach Apple). It's checked, not assumed.
        if: steps.signing.outputs.notarize == 'true'
        run: |
          BUNDLE_DIR=src-tauri/target/universal-apple-darwin/release/bundle
          APP="$BUNDLE_DIR/macos/Termic.app"
          DMG="$BUNDLE_DIR/dmg/${{ steps.meta.outputs.dmg_name }}"

          echo "→ codesign integrity"
          codesign --verify --deep --strict --verbose=2 "$APP"

          echo "→ hardened runtime (notarization is refused without it)"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee /tmp/cs.txt
          grep -qE 'flags=.*runtime' /tmp/cs.txt || {
            echo "::error::Hardened runtime flag missing from the signature."; exit 1; }

          echo "→ Gatekeeper assessment"
          spctl -a -vvv -t exec "$APP" 2>&1 | tee /tmp/spctl.txt || true
          grep -q 'source=Notarized Developer ID' /tmp/spctl.txt || {
            echo "::error::App is not assessed as 'Notarized Developer ID'. It will not open on a user's Mac."; exit 1; }

          echo "→ stapled ticket (app)"
          xcrun stapler validate "$APP"

          # The DMG is the download path for everyone not on Homebrew, and it
          # is assessed by Gatekeeper in its own right - a notarized .app in
          # an unnotarized .dmg still gets the "Apple cannot check it" wall on
          # double-click. Both of these are hard failures: they are exactly
          # what the previous step exists to guarantee.
          echo "→ stapled ticket (dmg)"
          xcrun stapler validate "$DMG"

          echo "→ Gatekeeper assessment of the DMG itself"
          spctl -a -vvv -t open --context context:primary-signature "$DMG" 2>&1 | tee /tmp/spctl-dmg.txt || true
          grep -q 'source=Notarized Developer ID' /tmp/spctl-dmg.txt || {
            echo "::error::The DMG is not assessed as 'Notarized Developer ID'. Downloading it and double-clicking would still hit the Gatekeeper wall."; exit 1; }

          echo "✓ App and DMG both signed, notarized, stapled."
      - name: Compute SHA256 + read .sig
        id: hashes
        run: |
          BUNDLE_DIR=src-tauri/target/universal-apple-darwin/release/bundle
          DMG="$BUNDLE_DIR/dmg/${{ steps.meta.outputs.dmg_name }}"
          ls -la "$DMG"
          SHA=$(shasum -a 256 "$DMG" | awk '{print $1}')
          echo "dmg_sha=$SHA" >> "$GITHUB_OUTPUT"
          SIG=$(cat "$BUNDLE_DIR/macos/Termic.app.tar.gz.sig")
          { echo 'sig<<EOF'; echo "$SIG"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: termic-${{ steps.meta.outputs.version }}-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Termic.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Termic.app.tar.gz.sig

  # ─── Linux x86_64 AppImage ────────────────────────────────────────
  # Single artifact: a signed AppImage. We skip .deb / .rpm on purpose
  # (Tauri's updater can't replace package-manager-owned files, so
  # shipping them would silently break self-update for those users).
  # AppImage is the only format the updater can drop in place.
  #
  # Pinned to ubuntu-22.04, NOT ubuntu-latest, for two load-bearing
  # reasons (AppImage best practice is "build on the oldest supported
  # LTS"):
  #   1. glibc floor: the binary links the runner's glibc, so 22.04
  #      (2.35) runs on far more distros than 24.04 (2.39).
  #   2. tauri-bundler copies the runner's libwebkit2gtk-4.1.so.0 INTO
  #      the AppImage. 24.04's newer WebKitGTK gray-screens on X11
  #      setups (seen on openSUSE) where 22.04's renders fine — verified
  #      by comparing against another Tauri app (Terax) built on 22.04
  #      that works on the same machine. 22.04 ships WebKitGTK 4.1 too,
  #      which is all Tauri 2 requires.
  build-linux:
    needs: [validate, server-bins, server-bins-mac]
    runs-on: ubuntu-22.04
    outputs:
      version:        ${{ steps.meta.outputs.version }}
      appimage_name:  ${{ steps.find.outputs.appimage_name }}
      appimage_sha:   ${{ steps.hashes.outputs.appimage_sha }}
      sig:            ${{ steps.hashes.outputs.sig }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: termic-server*
          merge-multiple: true
          path: src-tauri/resources/termic-server
      - name: Resolve version
        id: meta
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: System dependencies
        # The WebKitGTK 4.1 + GTK3 + AppIndicator3 + librsvg2 quartet
        # is exactly what tauri-runtime-wry links against. libsoup-3
        # is required by the new webkit2gtk-4.1 (the 4.0 line used
        # libsoup-2). libxdo-dev is for tauri's auto-typer plugin.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file git pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libsoup-3.0-dev libxdo-dev
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Cache Rust target dir
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          # ubuntu2204 in the key, not runner.os: objects cached from a
          # different runner image would link against its newer glibc.
          key: cargo-ubuntu2204-linux-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: npm ci
      - name: Build & sign (AppImage)
        # --bundles appimage skips .deb / .rpm so we don't spend build
        # time on artifacts we won't publish. The .AppImage.sig file
        # is produced automatically alongside it because
        # `createUpdaterArtifacts: true` is set in tauri.conf.json
        # and the signing env vars are present.
        env:
          TAURI_SIGNING_PRIVATE_KEY:          ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles appimage
      - name: Repair AppImage root symlinks + re-sign
        # tauri-bundler writes the AppDir's root symlinks (.DirIcon and
        # Termic.desktop) with ABSOLUTE targets, so the runner's
        # /home/runner/... paths get baked into the squashfs
        # (tauri-apps/tauri#15110, no merged fix as of cli 2.11). On
        # user machines those links dangle: Gear Lever/AppImageLauncher
        # abort integration with "Symlink target not found" and the
        # desktop/dock icon never resolves (.DirIcon is what every
        # integration tool reads). Until upstream merges a fix: unpack,
        # relink relative, repack with appimagetool, and re-sign (the
        # repack invalidates the .sig `tauri build` just produced; the
        # later "Compute SHA256 + read .sig" step picks up the new one).
        env:
          TAURI_SIGNING_PRIVATE_KEY:          ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUNDLE_DIR=src-tauri/target/release/bundle/appimage

          # Static appimagetool; --appimage-extract-and-run avoids the
          # FUSE requirement on GitHub runners.
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool

          cd "$BUNDLE_DIR"
          NAME=$(basename "$(ls ./*.AppImage | head -n1)")
          "./$NAME" --appimage-extract >/dev/null   # → squashfs-root/

          # Strip bundled libwayland-*: it's on the official AppImage
          # excludelist ("New version of Mesa has some dependency issues
          # with libwayland-client if it is bundled") but Tauri's GTK
          # plugin bundles it anyway. The stale copy shadows the host's
          # and breaks mesa's EGL bootstrap, so WebKitGTK 2.46+ (EGL-
          # only, no GLX fallback) aborts with "Could not create default
          # EGL display: EGL_BAD_PARAMETER" and the window stays blank.
          # Verified on openSUSE X11 + AMD: removing these from the
          # extracted AppImage is what made Termic render. Every distro
          # that can run our GTK3 build ships libwayland, so relying on
          # the host copy is safe.
          rm -fv squashfs-root/usr/lib/libwayland-*.so*

          # Issue #48: make the GTK backend overridable instead of forced.
          # linuxdeploy-plugin-gtk.sh hard-codes `export GDK_BACKEND=x11`,
          # so Termic always runs through XWayland on Wayland desktops. On
          # AMD + mutter that triggers XWayland frame-presentation stalls
          # that freeze the window while every process stays alive. We keep
          # x11 as the DEFAULT (tauri-apps/tauri#8541) but honor a caller-
          # provided value, so users on stacks where Wayland works can run
          # `GDK_BACKEND=wayland termic`. Zero change for anyone who doesn't
          # set it. Fail loud if the hard-coded line ever disappears.
          GTK_HOOK=squashfs-root/apprun-hooks/linuxdeploy-plugin-gtk.sh
          grep -q '^export GDK_BACKEND=x11' "$GTK_HOOK"
          sed -i 's|^export GDK_BACKEND=x11|export GDK_BACKEND="${GDK_BACKEND:-x11}"|' "$GTK_HOOK"

          # Issue #47 (AppRun.wrapped exports PYTHONHOME/PYTHONPATH/PERLLIB
          # into the AppDir, which broke python3/perl in every shell Termic
          # spawns) is handled in the app now: src-tauri/src/appimage_env.rs
          # strips every AppDir-pointing variable from each child it spawns,
          # LD_LIBRARY_PATH included.
          #
          # It used to be a /bin/sh wrapper here that unset the three and
          # exec'd the real binary renamed to `termic.bin`. Do NOT bring
          # that back: GTK names the window after the executable, so the
          # rename made WM_CLASS "termic.bin", which matches no desktop
          # entry (StartupWMClass=Termic), and GNOME's dock showed a
          # generic cog instead of the app icon. The binary must stay
          # an ELF called `termic`. Fail loud if a bundler change wraps it.
          head -c4 squashfs-root/usr/bin/termic | grep -q ELF

          # Rewrite every absolute symlink that points inside the build
          # AppDir to a relative one. Anything absolute pointing OUTSIDE
          # the AppDir is already broken today; warn so it shows in logs.
          find squashfs-root -type l | while IFS= read -r link; do
            tgt=$(readlink "$link")
            case "$tgt" in /*) ;; *) continue ;; esac
            inner="${tgt#*.AppDir/}"
            if [ "$inner" = "$tgt" ]; then
              echo "::warning::absolute symlink escapes the AppDir: $link -> $tgt"
              continue
            fi
            rel=$(realpath -m --relative-to="$(dirname "$link")" "squashfs-root/$inner")
            echo "relink: $link -> $rel (was $tgt)"
            ln -sfn "$rel" "$link"
          done

          # Canonical modes before repacking. Everything inside the image is
          # owned by root, so the user who runs it is OTHER: a file without
          # o+x is a file they cannot execute. tauri-bundler ships
          # AppRun.wrapped as 0770 (rwxrwx---), which the AppImage catalog's
          # test caught as "AppRun: line 12: AppRun.wrapped: Permission
          # denied" under firejail, and which every release since Linux
          # support landed has carried (verified against the published 1.9.1
          # and 1.10.0 artifacts with unsquashfs). A plain `./Termic.AppImage`
          # usually survives it because squashfuse does not enforce the mode
          # for the mounting user, so this stayed invisible: any stricter
          # mount (firejail, `default_permissions`, an extract-then-run as a
          # different user) fails outright.
          #
          # Normalized wholesale rather than by name, so the next file that
          # arrives with a private mode is fixed too: 0755 for directories and
          # anything already executable by its owner, 0644 for the rest.
          # gschemas.compiled ships 0666 for the same kind of reason.
          find squashfs-root -type d -exec chmod 0755 {} +
          find squashfs-root -type f -perm -u+x -exec chmod 0755 {} +
          find squashfs-root -type f ! -perm -u+x -exec chmod 0644 {} +
          # And fail loud if anything is still unreachable for `other`, which
          # is what shipping this again would look like.
          BAD=$(
            find squashfs-root \( -type f -o -type d \) ! -perm -o+r -print
            find squashfs-root -type f -perm -u+x ! -perm -o+x -print
          )
          if [ -n "$BAD" ]; then
            echo "::error::AppDir entries a normal user cannot read or execute:"
            echo "$BAD"
            exit 1
          fi

          rm -f "$NAME"
          # `-u` embeds update information in the AppImage's `.upd_info` ELF
          # section and writes the matching `.zsync` beside it. That is what
          # AppImageUpdate, Gear Lever and AppImageLauncher read to offer an
          # update, and what makes that update a DELTA: zsync pulls only the
          # squashfs blocks that changed instead of the whole ~100MB image.
          # Without it those tools correctly report the AppImage as having no
          # update source, and a user who manages it that way is stuck on the
          # version they downloaded unless they happen to open the app.
          #
          # Termic's own Tauri updater is unaffected either way: it fetches
          # latest.json and swaps the file whole. The two are independent, and
          # a user can be served by either.
          #
          # `latest` resolves through the GitHub API at check time, so the
          # embedded string stays correct for every future release and the
          # glob absorbs the version in the filename.
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY#*/}"
          # DERIVED from the real filename, never written out. The first cut of
          # this hardcoded `termic_*_amd64.AppImage.zsync`, from the comment
          # below that says Tauri lowercases productName. It does not: the
          # asset is `Termic_<v>_amd64.AppImage`, and v1.11.2 shipped with an
          # update string whose case did not match the file it names. A
          # container test caught nothing because the fixture name was invented
          # to match the assumption.
          ZSYNC_GLOB="$(printf '%s' "$NAME" | sed -E 's/_[0-9][0-9A-Za-z.+-]*_/_*_/')".zsync
          case "$ZSYNC_GLOB" in
            *'*'*) ;;
            *) echo "::error::could not derive a version glob from $NAME"; exit 1 ;;
          esac
          echo "update info: gh-releases-zsync|${OWNER}|${REPO}|latest|${ZSYNC_GLOB}"
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run -n \
            -u "gh-releases-zsync|${OWNER}|${REPO}|latest|${ZSYNC_GLOB}" \
            squashfs-root "$NAME"
          rm -rf squashfs-root

          # The .zsync is useless if it is not published, and embedded update
          # info pointing at a file that does not exist is WORSE than none:
          # the tools stop reporting "no update source" and start reporting a
          # broken one. So this fails the release rather than shipping it.
          if [ ! -s "${NAME}.zsync" ]; then
            echo "::error::appimagetool -u produced no ${NAME}.zsync; update info would point at nothing"
            exit 1
          fi
          # And the glob must actually MATCH the file being published. This is
          # the check that would have caught the case mismatch above, and it
          # costs nothing: the answer is knowable right here.
          case "${NAME}.zsync" in
            $ZSYNC_GLOB) ;;
            *) echo "::error::update info glob '$ZSYNC_GLOB' does not match the published ${NAME}.zsync"; exit 1 ;;
          esac
          # Best effort: confirm the section actually landed. A warning, not a
          # failure, because this is a cross-check of appimagetool's own work
          # and binutils is not something the release should depend on.
          if command -v readelf >/dev/null 2>&1; then
            readelf -x .upd_info "$NAME" >/dev/null 2>&1 \
              || echo "::warning::no .upd_info section found in $NAME"
          fi

          cd "$GITHUB_WORKSPACE"
          npx tauri signer sign "$BUNDLE_DIR/$NAME"   # rewrites $NAME.sig
      - name: Locate AppImage
        # Globbed, never spelled out. The form is `Termic_<v>_amd64.AppImage`
        # (productName's own case, NOT lowercased: a stale comment here said
        # otherwise and cost v1.11.2 a mismatched zsync update string).
        id: find
        run: |
          BUNDLE_DIR=src-tauri/target/release/bundle/appimage
          ls -la "$BUNDLE_DIR"
          APPIMAGE=$(ls "$BUNDLE_DIR"/*.AppImage | head -n1)
          NAME=$(basename "$APPIMAGE")
          echo "appimage_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "appimage_path=$APPIMAGE" >> "$GITHUB_ENV"
      - name: Compute SHA256 + read .sig
        id: hashes
        run: |
          SHA=$(sha256sum "$appimage_path" | awk '{print $1}')
          echo "appimage_sha=$SHA" >> "$GITHUB_OUTPUT"
          SIG=$(cat "${appimage_path}.sig")
          { echo 'sig<<EOF'; echo "$SIG"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: termic-${{ steps.meta.outputs.version }}-linux-x86_64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/appimage/*.AppImage.zsync

  # ─── Windows x64 (experimental) ────────────────────────────────────
  # The signature is checked against the app's own public key before
  # anything is uploaded: a wrong key would otherwise ship installs that
  # never update.
  build-windows:
    needs: [validate, server-bins, server-bins-mac]
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version:    ${{ steps.meta.outputs.version }}
      setup_name: ${{ steps.find.outputs.setup_name }}
      sig:        ${{ steps.hashes.outputs.sig }}
    defaults:
      run:
        shell: bash
    steps:
      # .gitattributes pins LF; this keeps Git for Windows from rewriting
      # the checkout anyway.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: termic-server*
          merge-multiple: true
          path: src-tauri/resources/termic-server
      - name: Resolve version
        id: meta
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build & sign (NSIS)
        env:
          TAURI_SIGNING_PRIVATE_KEY:          ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis
      - name: Locate installer
        id: find
        run: |
          BUNDLE_DIR=src-tauri/target/release/bundle/nsis
          ls -la "$BUNDLE_DIR"
          SETUP=$(ls "$BUNDLE_DIR"/*-setup.exe | head -n1)
          echo "setup_name=$(basename "$SETUP")" >> "$GITHUB_OUTPUT"
          echo "setup_path=$SETUP" >> "$GITHUB_ENV"
      - name: Verify the updater signature against the app's key
        run: node scripts/verify-updater-sig.mjs "$setup_path"
      - name: Read .sig
        id: hashes
        run: |
          SIG=$(cat "${setup_path}.sig")
          { echo 'sig<<EOF'; echo "$SIG"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: termic-${{ steps.meta.outputs.version }}-windows-x86_64
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig

  # ─── Stitch the universal build into a Release ────────────────────
  release:
    needs: [build-mac, build-linux, server-bins, server-bins-mac]
    runs-on: ubuntu-latest
    steps:
      # Checked out FIRST (before the artifacts land in mac/ and linux/) so
      # the release-notes body can be extracted from CHANGELOG.md at the
      # pushed tag. checkout cleans the workspace, so it has to precede the
      # downloads.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: termic-${{ needs.build-mac.outputs.version }}-universal
          path: mac
      - uses: actions/download-artifact@v4
        with:
          name: termic-${{ needs.build-linux.outputs.version }}-linux-x86_64
          path: linux
      # termic-server for `curl -fsSL https://termic.dev/install-server.sh | sh`
      # (termic.dev public/install-server.sh): the four builds, the version
      # they carry, and a checksum file the script verifies against. The mac
      # ones keep the linker's ad hoc signature, enough for a file curl
      # writes (no quarantine).
      - uses: actions/download-artifact@v4
        with:
          pattern: termic-server*
          merge-multiple: true
          path: server
      - name: Checksum the termic-server builds
        run: |
          set -euo pipefail
          cd server
          test "$(ls termic-server-*-linux-musl termic-server-*-apple-darwin | wc -l)" -eq 4
          sha256sum termic-server-*-linux-musl termic-server-*-apple-darwin > termic-server-SHA256SUMS
          cat termic-server-version.txt termic-server-SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-mac.outputs.version }}
          LINUX_APPIMAGE: ${{ needs.build-linux.outputs.appimage_name }}
          NOTARIZED: ${{ needs.build-mac.outputs.notarized }}
        run: |
          # Lead with WHAT CHANGED (extracted verbatim from CHANGELOG.md),
          # then a short install footer. Direct-download and email-notified
          # users want the release notes, not an install wall (GH #39). The
          # full per-platform install + update guide lives on termic.dev and
          # in the README. The changelog body is piped through a file (not a
          # shell var) so backticks in bullets like `.termic.yaml` stay
          # literal instead of being command-substituted.
          {
          echo "## What's changed"
          echo
          node scripts/changelog.mjs notes "$VERSION"
          echo
          echo "---"
          echo
          echo "## Install"
          echo
          # The mac line follows the artifact, not our hopes for it. It says
          # "strip the quarantine bit" only for a build that actually needs
          # it, and stops saying so the moment build-mac proves the DMG is
          # notarized (which it only claims after spctl + stapler pass). No
          # release can tell users to defeat Gatekeeper on a build that
          # doesn't need it, or forget to when it does.
          if [ "$NOTARIZED" = "true" ]; then
            cat <<'FOOTER'
          - **macOS** (universal): `brew install --cask simion/termic/termic`, or download the `.dmg` below. Signed and notarized by Apple, so it opens on first launch with nothing else to do.
          FOOTER
          else
            cat <<'FOOTER'
          - **macOS** (universal): `brew install --cask simion/termic/termic` (handles Gatekeeper), or download the `.dmg` below and run `xattr -dr com.apple.quarantine /Applications/Termic.app` to clear it.
          FOOTER
          fi
          cat <<'FOOTER'
          - **Linux** (x86_64): download the `.AppImage` below, then `chmod +x` it and run. Sandbox is macOS-only; everything else works the same. The image carries zsync update info, so Gear Lever and AppImageUpdate can update it in place (the `.zsync` beside it is for them, not for you).

          - **Termic server** (Linux or macOS, for agents on another machine): add it from the app, Settings > Remote, or on the server run `curl -fsSL https://termic.dev/install-server.sh | sh`. The app keeps it on its own version from then on.

          The app self-updates after install. Full install and update help: https://termic.dev
          FOOTER
          } > release-notes.md
          gh release create "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md \
            mac/dmg/*.dmg mac/macos/* \
            linux/*.AppImage linux/*.AppImage.sig linux/*.AppImage.zsync \
            server/termic-server-*

  # ─── Attach the Windows build to the release ──────────────────────
  # After the release exists, and only if the Windows build succeeded, so a
  # Windows failure costs Windows users this version and nothing else.
  release-windows:
    needs: [build-windows, release]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.build-windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: termic-${{ needs.build-windows.outputs.version }}-windows-x86_64
          path: windows
      - name: Upload installer + note it in the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-windows.outputs.version }}
        run: |
          gh release upload "v${VERSION}" --repo "${{ github.repository }}" \
            windows/*-setup.exe windows/*-setup.exe.sig
          gh release view "v${VERSION}" --repo "${{ github.repository }}" --json body -q .body > notes.md
          cat >> notes.md <<'NOTE'
          - **Windows** (x64, experimental): download the `-setup.exe` below and run it. It is not code-signed yet, so SmartScreen asks first: More info, then Run anyway. The sandbox is Docker only on Windows.
          NOTE
          gh release edit "v${VERSION}" --repo "${{ github.repository }}" --notes-file notes.md

  # ─── Bump the Homebrew cask ────────────────────────────────────────
  bump-tap:
    needs: [build-mac, release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Hard-coded so PRs from forks can't override. homebrew-termic is
        # the legacy tap, kept current so `simion/termic/termic` still works.
        tap: [simion/homebrew-tap, simion/homebrew-termic]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.tap }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Bump cask (version + universal sha256)
        run: |
          cd tap
          VERSION="${{ needs.build-mac.outputs.version }}"
          SHA="${{ needs.build-mac.outputs.dmg_sha }}"
          # The universal cask has a single top-level `sha256` with
          # the `# @sha-arm` anchor (kept named that way for sed
          # backwards compat; the binary itself is now arm+intel
          # fused). One DMG, one sha, no per-arch split needed.
          #
          # We rewrite the whole `sha256 "…" # @sha-arm` line in one
          # shot — keeps the anchor pinned to the value line even if
          # it ever drifts (a prior breakage that landed an empty
          # `sha256 ""` in the tap and broke integrity verification
          # for end users; brew silently falls back to :no_check).
          # The match deliberately accepts empty quotes too.
          sed -i.bak -E "s|^  version \".*\"|  version \"$VERSION\"|" Casks/termic.rb
          sed -i.bak -E "s|^  sha256 \"[^\"]*\".*$|  sha256 \"$SHA\" # @sha-arm|" Casks/termic.rb
          rm Casks/termic.rb.bak

          # Fail-fast: if the sha line isn't exactly what we expect
          # (right sha + anchor present), abort rather than push a
          # broken tap that disables checksum verification silently.
          if ! grep -qE "^  sha256 \"${SHA}\" # @sha-arm\$" Casks/termic.rb; then
            echo "✗ Cask sha256 line did not update as expected. Aborting."
            grep -n 'sha256' Casks/termic.rb || true
            exit 1
          fi
          git config user.name  "termic-bot"
          git config user.email "termic-bot@users.noreply.github.com"
          git add Casks/termic.rb
          git commit -m "termic $VERSION"
          git push

  # ─── Bump the updater manifest + changelog ─────────────────────────
  # Two files land in the termic.dev repo:
  #   * latest.json    — Tauri updater manifest (Rust-side, signed).
  #   * changelog.json — what the in-app Update card + Changelog dialog
  #                      render. Source of truth is changelog.json in
  #                      THIS repo (authored by scripts/release.sh); it's
  #                      copied over verbatim.
  bump-website:
    # release-windows is waited for but may be skipped or fail; the manifest
    # then simply has no Windows entry, as before.
    needs: [build-mac, build-linux, build-windows, release, release-windows]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # The termic.dev repo — where both files get committed.
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.WEBSITE_REPO }}
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          path: site
      # This repo at the pushed tag — for changelog.json.
      - uses: actions/checkout@v4
        with:
          path: app
      - name: Write update manifest + changelog
        env:
          MAC_SIG:   ${{ needs.build-mac.outputs.sig }}
          LINUX_SIG: ${{ needs.build-linux.outputs.sig }}
          LINUX_APPIMAGE: ${{ needs.build-linux.outputs.appimage_name }}
          WINDOWS_OK:    ${{ needs.release-windows.result == 'success' }}
          WINDOWS_SIG:   ${{ needs.build-windows.outputs.sig }}
          WINDOWS_SETUP: ${{ needs.build-windows.outputs.setup_name }}
        run: |
          cd site
          VERSION="${{ needs.build-mac.outputs.version }}"
          # tauri-plugin-updater dispatches on the platform key matching
          # the running app's arch. With a universal mac binary both
          # arches point at the SAME .app.tar.gz — macOS extracts the
          # matching slice at install. Linux gets one x86_64 AppImage
          # (no aarch64 yet — add `linux-aarch64` once we have an ARM
          # Linux runner). Each platform's signature is its OWN ed25519
          # signature, not shared with mac.
          BASE="https://github.com/${{ github.repository }}/releases/download/v$VERSION"
          cat > "${{ env.WEBSITE_MANIFEST_PATH }}" <<JSON
          {
            "version": "$VERSION",
            "notes": "See https://github.com/${{ github.repository }}/releases/tag/v$VERSION",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$MAC_SIG",
                "url": "$BASE/Termic.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "$MAC_SIG",
                "url": "$BASE/Termic.app.tar.gz"
              },
              "linux-x86_64": {
                "signature": "$LINUX_SIG",
                "url": "$BASE/$LINUX_APPIMAGE"
              }
            }
          }
          JSON
          # Windows only when its installer is actually on the release: an
          # entry pointing at a missing asset would make every Windows
          # install fail its update check instead of just not seeing one.
          if [ "$WINDOWS_OK" = "true" ]; then
            BASE="$BASE" node -e '
              const fs = require("fs"), p = process.argv[1];
              const m = JSON.parse(fs.readFileSync(p, "utf8"));
              m.platforms["windows-x86_64"] = { signature: process.env.WINDOWS_SIG, url: process.env.BASE + "/" + process.env.WINDOWS_SETUP };
              fs.writeFileSync(p, JSON.stringify(m, null, 2) + "\n");
            ' "${{ env.WEBSITE_MANIFEST_PATH }}"
          fi
          # Both changelog artifacts are copied verbatim from the termic
          # repo (CHANGELOG.md is the source of truth; changelog.json is the
          # slim derived summary file generated by scripts/release.sh). The
          # in-app Changelog dialog + the /changelog page render the .md; the
          # Update card reads the .json summary.
          cp ../app/changelog.json "${{ env.WEBSITE_CHANGELOG_PATH }}"
          cp ../app/CHANGELOG.md    "${{ env.WEBSITE_CHANGELOG_MD_PATH }}"
          git config user.name  "termic-bot"
          git config user.email "termic-bot@users.noreply.github.com"
          git add "${{ env.WEBSITE_MANIFEST_PATH }}" "${{ env.WEBSITE_CHANGELOG_PATH }}" "${{ env.WEBSITE_CHANGELOG_MD_PATH }}"
          git commit -m "updater: bump to $VERSION + changelog"
          git push
